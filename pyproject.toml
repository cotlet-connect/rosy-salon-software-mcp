[project]
name = "rosy-salon-software-mcp"
version = "1.1.0"
description = "Connect Rosy Salon Software to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Rosy Salon Software API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["rosy salon software", "rosy salon software api", "rosy salon software mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/rosy-salon-software-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=rosy-salon-software"
Source = "https://github.com/cotlet-connect/rosy-salon-software-mcp"

[project.scripts]
rosy-salon-software-mcp = "rosy_salon_software_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"rosy_salon_software_agent.py" = "rosy_salon_software_agent.py"

[tool.hatch.build.targets.sdist]
include = ["rosy_salon_software_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
